function initials(name) {
  return name.split(' ').filter(Boolean).map(function(w){ return w[0]; }).slice(0,2).join('').toUpperCase();
}
function emailFirst(name) {
  return name.split(' ')[0].toLowerCase();
}

// ── Render grid ──────────────────────────────────────────────────
function renderGrid(list) {
  var grid = document.getElementById('tdGrid');
  var count = document.getElementById('tdCount');
  grid.innerHTML = '';
  count.textContent = list.length + ' team member' + (list.length !== 1 ? 's' : '');

  list.forEach(function(m) {
    var c = CAT_COLORS[m.cat];
    var card = document.createElement('article');
    card.className = 'td-card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.innerHTML =
      '<div class="td-card-top">' +
        '<div class="td-avatar" style="background:' + c.avatarBg + ';color:' + c.avatarText + '">' + initials(m.name) + '</div>' +
        '<div class="td-card-info">' +
          '<p class="td-card-name">' + m.name + '</p>' +
          '<p class="td-card-role">' + m.role + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="td-card-badge"><span class="td-badge" style="background:' + c.light + ';color:' + c.text + '">' + m.badge + '</span></div>' +
      '<div class="td-card-specs">' +
        m.specs.slice(0,3).map(function(s){ return '<span class="td-spec">' + s + '</span>'; }).join('') +
      '</div>' +
      '<div class="td-card-contact">' +
        '<span class="td-contact-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg" style="width:12px;height:12px"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>' + m.email + '</span>' +
      '</div>';

    card.addEventListener('click', function(){ openPanel(m); });
    card.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPanel(m); } });
    grid.appendChild(card);
  });
}

// ── Filter logic ─────────────────────────────────────────────────
var curCat = 'all';
var curQ   = '';

function applyFilter() {
  var q = curQ.toLowerCase();
  var list = TEAM.filter(function(m) {
    var matchCat = curCat === 'all' || m.cat === curCat;
    var matchQ   = !q ||
      m.name.toLowerCase().includes(q) ||
      m.role.toLowerCase().includes(q) ||
      m.badge.toLowerCase().includes(q) ||
      m.email.toLowerCase().includes(q) ||
      m.specs.some(function(s){ return s.toLowerCase().includes(q); }) ||
      m.bio.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  renderGrid(list);
}

document.getElementById('tdSearch').addEventListener('input', function() {
  curQ = this.value;
  applyFilter();
});

document.querySelectorAll('.td-filter').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.td-filter').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    curCat = btn.getAttribute('data-cat');
    applyFilter();
  });
});

      m.specs.map(function(s){ return '<span class="td-spec">' + s + '</span>'; }).join('') +
    '</div>';

  document.getElementById('tdPanel').classList.add('open');
  document.getElementById('tdOverlay').classList.add('open');
  document.body.classList.add('td-noscroll');
}

function closePanel() {
  document.getElementById('tdPanel').classList.remove('open');
  document.getElementById('tdOverlay').classList.remove('open');
  document.body.classList.remove('td-noscroll');
}

function copyEmail(email, btn) {
  navigator.clipboard.writeText(email).then(function() {
    btn.textContent = '✓ Copied!';
    setTimeout(function(){ btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg" style="width:14px;height:14px"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy email'; }, 2000);
  });
}

document.getElementById('tdClose').addEventListener('click', closePanel);
document.getElementById('tdOverlay').addEventListener('click', closePanel);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closePanel(); });

// ── Init ─────────────────────────────────────────────────────────
applyFilter();
</script>
</body>
</html>
