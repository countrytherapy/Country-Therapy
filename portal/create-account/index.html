<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – Country Therapy</title>
  <link rel="icon" type="image/png" href="../../assets/images/Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/nav-footer.css" />
  <link rel="stylesheet" href="../../assets/css/portal/auth.css" />
</head>
<body>

<div id="nav-root"></div>

<section class="auth-section">
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-blob auth-blob-1"></div>
    <div class="auth-blob auth-blob-2"></div>
    <div class="auth-blob auth-blob-3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="../../assets/images/Logo.png" alt="Country Therapy" />
    </div>
    <div class="auth-dots" aria-hidden="true">
      <span style="background:#4A90C4"></span>
      <span style="background:#F5C842"></span>
      <span style="background:#E85D7A"></span>
      <span style="background:#6B8F71"></span>
    </div>
    <h1>Create <em>Account</em></h1>
    <p>Join our community of educators and professionals for exclusive OT resources.</p>

    <div id="message" class="auth-message"></div>

    <form id="signup-form" class="auth-form">
      <div class="auth-field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Jane Smith" required autocomplete="name" />
      </div>
      <div class="auth-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="email@example.com" required autocomplete="email" />
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="auth-field">
        <label for="passwordConfirm">Confirm Password</label>
        <input type="password" id="passwordConfirm" placeholder="••••••••" required autocomplete="new-password" />
      </div>
      <button type="submit" class="auth-submit">
        Create Account
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" xmlns="http://www.w3.org/2000/svg"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </button>
    </form>

    <div class="auth-links">
      <p>Already have an account? <a href="../login/">Log in here</a></p>
    </div>
  </div>
</section>

<div id="footer-root"></div>
<script src="../../assets/js/components.js"></script>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabaseUrl     = 'https://dlvpvlglgcrhhctkxhvl.supabase.co';
  const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdnB2bGdsZ2NyaGhjdGt4aHZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzI3NjQsImV4cCI6MjA4ODYwODc2NH0.JzGbL8mRspWwzKYfthS9eWuZv8HTb7I0AFBPvQ1Ixqw';

  const supabase  = createClient(supabaseUrl, supabaseAnonKey);
  const messageEl = document.getElementById('message');
  const form      = document.getElementById('signup-form');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    messageEl.textContent = '';
    messageEl.className = 'auth-message';

    const fullName        = document.getElementById('fullName').value.trim();
    const email           = document.getElementById('email').value.trim();
    const password        = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('passwordConfirm').value;

    if (!fullName || !email || !password || !passwordConfirm) {
      messageEl.textContent = 'Please fill in all fields.';
      messageEl.className = 'auth-message auth-message--error';
      return;
    }
    if (password !== passwordConfirm) {
      messageEl.textContent = 'Passwords do not match.';
      messageEl.className = 'auth-message auth-message--error';
      return;
    }
    if (password.length < 8) {
      messageEl.textContent = 'Password must be at least 8 characters long.';
      messageEl.className = 'auth-message auth-message--error';
      return;
    }

    const submitBtn = form.querySelector('button');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';

    try {
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName },
          emailRedirectTo: window.location.origin + '/auth/login.html'
        }
      });
      if (error) throw error;

      messageEl.textContent = 'Account created! Please check your email to confirm.';
      messageEl.className = 'auth-message auth-message--success';
      form.reset();
    } catch (error) {
      messageEl.textContent = error.message || 'Unable to create account. Please try again.';
      messageEl.className = 'auth-message auth-message--error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Create Account <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
    }
  });
</script>
</body>
</html>
