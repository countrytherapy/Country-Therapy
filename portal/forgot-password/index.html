<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – Country Therapy</title>
  <link rel="icon" type="image/png" href="../assets/images/Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/nav-footer.css" />
  <link rel="stylesheet" href="../../assets/css/portal/auth.css" />
</head>
<body>

<div id="nav-root"></div>

<section class="auth-section">
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-blob auth-blob-1"></div>
    <div class="auth-blob auth-blob-2"></div>
    <div class="auth-blob auth-blob-3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="../assets/images/Logo.png" alt="Country Therapy" />
    </div>
    <div class="auth-dots" aria-hidden="true">
      <span style="background:#4A90C4"></span>
      <span style="background:#F5C842"></span>
      <span style="background:#E85D7A"></span>
      <span style="background:#6B8F71"></span>
    </div>
    <h1>Forgot <em>Password?</em></h1>
    <p>Enter your email address and we'll send you a link to reset your password.</p>

    <div id="message" class="auth-message"></div>

    <form id="forgot-password-form" class="auth-form">
      <div class="auth-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="email@example.com" required autocomplete="email" />
      </div>
      <button type="submit" class="auth-submit">
        Send Reset Link
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
      </button>
    </form>

    <div class="auth-links">
      <p>Remembered your password? <a href="login.html">Log in here</a></p>
    </div>
  </div>
</section>

<div id="footer-root"></div>
<script src="../assets/js/components.js"></script>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabaseUrl     = 'https://dlvpvlglgcrhhctkxhvl.supabase.co';
  const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdnB2bGdsZ2NyaGhjdGt4aHZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzI3NjQsImV4cCI6MjA4ODYwODc2NH0.JzGbL8mRspWwzKYfthS9eWuZv8HTb7I0AFBPvQ1Ixqw';

  const supabase  = createClient(supabaseUrl, supabaseAnonKey);
  const messageEl = document.getElementById('message');
  const form      = document.getElementById('forgot-password-form');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    messageEl.textContent = '';
    messageEl.className = 'auth-message';

    const email = document.getElementById('email').value.trim();

    if (!email) {
      messageEl.textContent = 'Please enter your email address.';
      messageEl.className = 'auth-message auth-message--error';
      return;
    }

    const submitBtn = form.querySelector('button');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    try {
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/auth/update-password.html'
      });
      if (error) throw error;

      messageEl.textContent = 'Check your email! We sent a password reset link.';
      messageEl.className = 'auth-message auth-message--success';
      document.getElementById('email').value = '';
    } catch (error) {
      messageEl.textContent = error.message || 'Something went wrong. Please try again.';
      messageEl.className = 'auth-message auth-message--error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Send Reset Link <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>';
    }
  });
</script>
</body>
</html>
